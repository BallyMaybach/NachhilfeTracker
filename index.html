<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nachhilfe">
<meta name="theme-color" content="#262624">
<title>Nachhilfe.</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #262624;
    --bg-elev: #1f1e1d;
    --surface: #30302e;
    --surface-hover: #3a3a37;
    --accent: #d97757;
    --accent-soft: rgba(217, 119, 87, 0.14);
    --green: #7ea87d;
    --green-soft: rgba(126, 168, 125, 0.14);
    --text: #f4f1ea;
    --muted: #9b968b;
    --sep: rgba(244, 241, 234, 0.08);
    --serif: "Tiempos", "Iowan Old Style", "Palatino", "Georgia", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, sans-serif;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* App container */
  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 18px calc(120px + var(--safe-bottom));
  }

  /* Header */
  .header {
    padding: 20px 4px 28px;
  }
  .title {
    font-family: var(--serif);
    font-size: 44px;
    line-height: 1;
    letter-spacing: -0.02em;
    font-weight: 500;
    margin: 0;
  }
  .title .dot {
    color: var(--accent);
    font-style: italic;
  }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-top: 8px;
    letter-spacing: -0.01em;
  }

  /* Stat Cards */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat {
    background: var(--bg-elev);
    border-radius: 18px;
    padding: 16px 18px;
    border: 1px solid var(--sep);
  }
  .stat-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .stat-value .unit {
    font-size: 20px;
    color: var(--muted);
    margin-left: 2px;
  }

  /* Offen Banner */
  .open-banner {
    background: var(--accent-soft);
    border: 1px solid rgba(217, 119, 87, 0.22);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .open-banner.hidden { display: none; }
  .open-label {
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .open-amount {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  /* Filter row */
  .filter-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 20px;
    margin-top: 4px;
  }
  .filter-scroll {
    flex: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: 2px 0;
    mask-image: linear-gradient(to right, black calc(100% - 20px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, black calc(100% - 20px), transparent 100%);
  }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    background: var(--surface);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    border: none;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.1s ease;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:active { transform: scale(0.96); }
  .chip.active {
    background: var(--accent);
    color: #1a1a18;
  }
  .add-student-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px dashed var(--muted);
    background: transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    padding: 0;
  }
  .add-student-btn:active {
    transform: scale(0.94);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Section title */
  .section-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 4px 4px 10px;
  }

  /* Sessions list */
  .sessions {
    background: var(--bg-elev);
    border-radius: 18px;
    border: 1px solid var(--sep);
    overflow: hidden;
  }
  .session {
    padding: 14px 16px;
    border-bottom: 1px solid var(--sep);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .session:last-child { border-bottom: none; }
  .session:active { background: var(--surface-hover); }

  .session-main {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .session-left { flex: 1; min-width: 0; }
  .session-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 3px;
  }
  .session-meta {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: -0.01em;
  }
  .session-right {
    text-align: right;
    flex-shrink: 0;
  }
  .session-amount {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .session-amount.open { color: var(--accent); }
  .session-status {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .session-status.paid { color: var(--green); }
  .session-status.open { color: var(--accent); }

  .session-actions {
    display: none;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--sep);
  }
  .session.expanded .session-actions { display: flex; }
  .action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s ease;
    background: var(--surface);
    color: var(--text);
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.toggle-paid { background: var(--green-soft); color: var(--green); }
  .action-btn.toggle-open { background: var(--accent-soft); color: var(--accent); }
  .action-btn.delete { background: rgba(220, 70, 70, 0.12); color: #e07b6b; }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .empty .em-title {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--text);
    margin-bottom: 6px;
    font-style: italic;
  }

  /* FAB */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(24px + var(--safe-bottom));
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #1a1a18;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 24px rgba(217, 119, 87, 0.35), 0 2px 6px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
  }
  .fab:active { transform: scale(0.92); }
  .fab svg { display: block; }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    z-index: 200;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }

  .modal {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg-elev);
    border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(24px + var(--safe-bottom));
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 201;
    max-height: 90vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal.visible { transform: translateY(0); }
  .modal-handle {
    width: 38px;
    height: 5px;
    border-radius: 3px;
    background: rgba(244, 241, 234, 0.18);
    margin: 0 auto 14px;
  }
  .modal-title {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .modal-subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
    margin-bottom: 18px;
  }

  /* Live preview */
  .preview {
    text-align: center;
    padding: 14px 0 18px;
    border-radius: 16px;
    background: var(--accent-soft);
    margin-bottom: 22px;
  }
  .preview-amount {
    font-family: var(--serif);
    font-size: 46px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .preview-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
    margin-top: 6px;
    opacity: 0.85;
  }

  .field-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 18px 2px 8px;
  }

  .student-chips, .duration-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }

  .input-wrap {
    position: relative;
  }
  .input-wrap .suffix {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  input[type="text"],
  input[type="number"],
  input[type="date"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="date"] {
    color-scheme: dark;
  }
  input[type="number"] { padding-right: 36px; }
  input:focus {
    border-color: var(--accent);
    background: var(--surface-hover);
  }
  input::placeholder { color: var(--muted); }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 24px;
  }
  .btn {
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--accent);
    color: #1a1a18;
  }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
  }

  .field-suffix-h::after { content: "€ / h"; }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">Nachhilfe<span class="dot">.</span></h1>
      <div class="subtitle">Deine Einheiten und Einnahmen</div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Diesen Monat</div>
        <div class="stat-value" id="statMonth">0<span class="unit"> €</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Stunden</div>
        <div class="stat-value" id="statHours">0<span class="unit"> h</span></div>
      </div>
    </section>

    <div class="open-banner hidden" id="openBanner">
      <div class="open-label">Noch offen</div>
      <div class="open-amount" id="openAmount">0 €</div>
    </div>

    <div class="filter-row">
      <div class="filter-scroll" id="filterScroll"></div>
      <button class="add-student-btn" id="addStudentBtn" aria-label="Schüler hinzufügen">+</button>
    </div>

    <div class="section-title">Einheiten</div>
    <div class="sessions" id="sessionsList"></div>
  </div>

  <button class="fab" id="fab" aria-label="Neue Einheit">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Overlays -->
  <div class="overlay" id="overlay"></div>

  <!-- Modal: Neue Einheit -->
  <div class="modal" id="sessionModal">
    <div class="modal-handle"></div>
    <h2 class="modal-title">Neue Einheit</h2>
    <div class="modal-subtitle">Schüler, Dauer und Stundenlohn festlegen</div>

    <div class="preview">
      <div class="preview-amount" id="previewAmount">20 €</div>
      <div class="preview-label">Verdient</div>
    </div>

    <div class="field-label">Schüler</div>
    <div class="student-chips" id="studentChips"></div>

    <div class="field-label">Dauer</div>
    <div class="duration-chips" id="durationChips">
      <button class="chip" data-duration="45">45 Min</button>
      <button class="chip active" data-duration="60">60 Min</button>
      <button class="chip" data-duration="90">90 Min</button>
      <button class="chip" data-duration="120">120 Min</button>
    </div>

    <div class="field-row">
      <div>
        <div class="field-label">Datum</div>
        <input type="date" id="sessionDate">
      </div>
      <div>
        <div class="field-label">€ / Stunde</div>
        <div class="input-wrap">
          <input type="number" id="sessionRate" inputmode="numeric" min="0" step="1">
          <span class="suffix">€</span>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" id="saveSession">Speichern</button>
      <button class="btn btn-secondary" id="cancelSession">Abbrechen</button>
    </div>
  </div>

  <!-- Modal: Neuer Schüler -->
  <div class="modal" id="studentModal">
    <div class="modal-handle"></div>
    <h2 class="modal-title">Neuer Schüler</h2>
    <div class="modal-subtitle">Name und Standard Stundenlohn</div>

    <div class="field-label">Name</div>
    <input type="text" id="newStudentName" placeholder="Vorname" autocomplete="off">

    <div class="field-label">Standard Stundenlohn</div>
    <div class="input-wrap">
      <input type="number" id="newStudentRate" inputmode="numeric" min="0" step="1" value="20">
      <span class="suffix">€ / h</span>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" id="saveStudent">Speichern</button>
      <button class="btn btn-secondary" id="cancelStudent">Abbrechen</button>
    </div>
  </div>

<script>
(function() {
  'use strict';

  const STUDENTS_KEY = 'nh_students_v3';
  const SESSIONS_KEY = 'nh_sessions_v3';

  const DEFAULT_STUDENTS = [
    { id: 's1', name: 'Korbinian', rate: 15 },
    { id: 's2', name: 'Sebastian', rate: 15 },
    { id: 's3', name: 'Tassilo',   rate: 20 },
    { id: 's4', name: 'Amai',      rate: 20 },
    { id: 's5', name: 'Lilly',     rate: 20 },
    { id: 's6', name: 'Matteo',    rate: 20 },
  ];

  // State
  let students = loadStudents();
  let sessions = loadSessions();
  let activeFilter = 'all';
  let expandedSessionId = null;

  // Modal state
  let modalStudentId = students[0] ? students[0].id : null;
  let modalDuration = 60;
  let modalRate = students[0] ? students[0].rate : 20;

  // --- Storage ---
  function loadStudents() {
    try {
      const raw = localStorage.getItem(STUDENTS_KEY);
      if (!raw) {
        localStorage.setItem(STUDENTS_KEY, JSON.stringify(DEFAULT_STUDENTS));
        return [...DEFAULT_STUDENTS];
      }
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) && parsed.length ? parsed : [...DEFAULT_STUDENTS];
    } catch (e) {
      return [...DEFAULT_STUDENTS];
    }
  }
  function saveStudents() {
    localStorage.setItem(STUDENTS_KEY, JSON.stringify(students));
  }
  function loadSessions() {
    try {
      const raw = localStorage.getItem(SESSIONS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveSessions() {
    localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
  }

  // --- Utils ---
  function formatEuro(n) {
    const rounded = Math.round(n * 100) / 100;
    return Number.isInteger(rounded) ? `${rounded} €` : `${rounded.toFixed(2).replace('.', ',')} €`;
  }
  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date();
    today.setHours(0,0,0,0);
    const yest = new Date(today);
    yest.setDate(yest.getDate() - 1);
    const dDay = new Date(d);
    dDay.setHours(0,0,0,0);
    if (dDay.getTime() === today.getTime()) return 'Heute';
    if (dDay.getTime() === yest.getTime()) return 'Gestern';
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yy = String(d.getFullYear()).slice(-2);
    return `${dd}.${mm}.${yy}`;
  }
  function todayISO() {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tz).toISOString().slice(0,10);
  }
  function sessionAmount(s) {
    return (s.duration / 60) * s.rate;
  }
  function uid() { return Math.random().toString(36).slice(2,10); }
  function studentById(id) { return students.find(s => s.id === id); }

  // --- Render ---
  function render() {
    renderStats();
    renderFilter();
    renderSessions();
  }

  function renderStats() {
    const now = new Date();
    const month = now.getMonth();
    const year = now.getFullYear();
    let monthEarn = 0;
    let totalMinutes = 0;
    let openSum = 0;
    sessions.forEach(s => {
      const d = new Date(s.date + 'T00:00:00');
      if (d.getMonth() === month && d.getFullYear() === year) {
        monthEarn += sessionAmount(s);
      }
      totalMinutes += s.duration;
      if (!s.paid) openSum += sessionAmount(s);
    });
    document.getElementById('statMonth').innerHTML =
      `${Math.round(monthEarn)}<span class="unit"> €</span>`;
    const hours = totalMinutes / 60;
    const hoursDisplay = Number.isInteger(hours) ? hours : hours.toFixed(1).replace('.', ',');
    document.getElementById('statHours').innerHTML =
      `${hoursDisplay}<span class="unit"> h</span>`;
    const banner = document.getElementById('openBanner');
    if (openSum > 0) {
      banner.classList.remove('hidden');
      document.getElementById('openAmount').textContent = formatEuro(openSum);
    } else {
      banner.classList.add('hidden');
    }
  }

  function renderFilter() {
    const scroll = document.getElementById('filterScroll');
    scroll.innerHTML = '';
    const all = document.createElement('button');
    all.className = 'chip' + (activeFilter === 'all' ? ' active' : '');
    all.textContent = 'Alle';
    all.addEventListener('click', () => { activeFilter = 'all'; render(); });
    scroll.appendChild(all);
    students.forEach(st => {
      const c = document.createElement('button');
      c.className = 'chip' + (activeFilter === st.id ? ' active' : '');
      c.textContent = st.name;
      c.addEventListener('click', () => { activeFilter = st.id; render(); });
      scroll.appendChild(c);
    });
  }

  function renderSessions() {
    const list = document.getElementById('sessionsList');
    list.innerHTML = '';
    let items = [...sessions].sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt||0) - (a.createdAt||0)));
    if (activeFilter !== 'all') {
      items = items.filter(s => s.studentId === activeFilter);
    }
    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `<div class="em-title">Noch nichts hier.</div><div>Tippe unten auf + für deine erste Einheit.</div>`;
      list.appendChild(empty);
      return;
    }
    items.forEach(s => {
      const st = studentById(s.studentId);
      if (!st) return;
      const el = document.createElement('div');
      el.className = 'session' + (expandedSessionId === s.id ? ' expanded' : '');
      const amount = sessionAmount(s);
      const amountStr = formatEuro(amount);
      el.innerHTML = `
        <div class="session-main">
          <div class="session-left">
            <div class="session-name">${escapeHtml(st.name)}</div>
            <div class="session-meta">${formatDate(s.date)} · ${s.duration} Min · ${s.rate} €/h</div>
          </div>
          <div class="session-right">
            <div class="session-amount ${s.paid ? '' : 'open'}">${amountStr}</div>
            <div class="session-status ${s.paid ? 'paid' : 'open'}">${s.paid ? 'bezahlt' : 'offen'}</div>
          </div>
        </div>
        <div class="session-actions">
          <button class="action-btn ${s.paid ? 'toggle-open' : 'toggle-paid'}" data-action="toggle">
            ${s.paid ? 'Als offen markieren' : 'Als bezahlt markieren'}
          </button>
          <button class="action-btn delete" data-action="delete">Löschen</button>
        </div>
      `;
      el.addEventListener('click', (e) => {
        const actionBtn = e.target.closest('[data-action]');
        if (actionBtn) {
          e.stopPropagation();
          if (actionBtn.dataset.action === 'toggle') {
            s.paid = !s.paid;
            saveSessions();
            render();
          } else if (actionBtn.dataset.action === 'delete') {
            if (confirm('Diese Einheit löschen?')) {
              sessions = sessions.filter(x => x.id !== s.id);
              expandedSessionId = null;
              saveSessions();
              render();
            }
          }
          return;
        }
        expandedSessionId = expandedSessionId === s.id ? null : s.id;
        render();
      });
      list.appendChild(el);
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // --- Session Modal ---
  function renderSessionModal() {
    // Student chips
    const wrap = document.getElementById('studentChips');
    wrap.innerHTML = '';
    students.forEach(st => {
      const c = document.createElement('button');
      c.className = 'chip' + (modalStudentId === st.id ? ' active' : '');
      c.textContent = st.name;
      c.addEventListener('click', () => {
        modalStudentId = st.id;
        modalRate = st.rate;
        document.getElementById('sessionRate').value = modalRate;
        renderSessionModal();
        updatePreview();
      });
      wrap.appendChild(c);
    });
    // Duration chips
    document.querySelectorAll('#durationChips .chip').forEach(ch => {
      const d = parseInt(ch.dataset.duration, 10);
      ch.classList.toggle('active', d === modalDuration);
    });
  }

  function updatePreview() {
    const amount = (modalDuration / 60) * modalRate;
    document.getElementById('previewAmount').textContent = formatEuro(amount);
  }

  function openSessionModal() {
    if (students.length === 0) {
      alert('Füge zuerst einen Schüler hinzu.');
      openStudentModal();
      return;
    }
    if (!modalStudentId || !studentById(modalStudentId)) {
      modalStudentId = students[0].id;
      modalRate = students[0].rate;
    }
    document.getElementById('sessionDate').value = todayISO();
    document.getElementById('sessionRate').value = modalRate;
    modalDuration = 60;
    renderSessionModal();
    updatePreview();
    showModal('sessionModal');
  }

  function closeSessionModal() { hideModal('sessionModal'); }

  document.querySelectorAll('#durationChips .chip').forEach(ch => {
    ch.addEventListener('click', () => {
      modalDuration = parseInt(ch.dataset.duration, 10);
      renderSessionModal();
      updatePreview();
    });
  });

  document.getElementById('sessionRate').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    modalRate = isNaN(v) ? 0 : v;
    updatePreview();
  });

  document.getElementById('saveSession').addEventListener('click', () => {
    const date = document.getElementById('sessionDate').value || todayISO();
    const rate = parseFloat(document.getElementById('sessionRate').value);
    if (!modalStudentId) return;
    if (isNaN(rate) || rate < 0) { alert('Bitte gültigen Stundenlohn eingeben.'); return; }
    const newSession = {
      id: uid(),
      studentId: modalStudentId,
      date: date,
      duration: modalDuration,
      rate: rate,
      paid: false,
      createdAt: Date.now()
    };
    sessions.push(newSession);
    // Update student default rate to reflect last used rate
    const st = studentById(modalStudentId);
    if (st && st.rate !== rate) {
      st.rate = rate;
      saveStudents();
    }
    saveSessions();
    closeSessionModal();
    render();
  });

  document.getElementById('cancelSession').addEventListener('click', closeSessionModal);

  // --- Student Modal ---
  function openStudentModal() {
    document.getElementById('newStudentName').value = '';
    document.getElementById('newStudentRate').value = 20;
    showModal('studentModal');
    setTimeout(() => document.getElementById('newStudentName').focus(), 300);
  }
  function closeStudentModal() { hideModal('studentModal'); }

  document.getElementById('saveStudent').addEventListener('click', () => {
    const name = document.getElementById('newStudentName').value.trim();
    const rate = parseFloat(document.getElementById('newStudentRate').value);
    if (!name) { alert('Name darf nicht leer sein.'); return; }
    if (isNaN(rate) || rate < 0) { alert('Bitte gültigen Stundenlohn eingeben.'); return; }
    const st = { id: uid(), name: name, rate: rate };
    students.push(st);
    saveStudents();
    closeStudentModal();
    render();
  });

  document.getElementById('cancelStudent').addEventListener('click', closeStudentModal);

  // --- Modal helpers ---
  function showModal(id) {
    document.getElementById('overlay').classList.add('visible');
    document.getElementById(id).classList.add('visible');
  }
  function hideModal(id) {
    document.getElementById('overlay').classList.remove('visible');
    document.getElementById(id).classList.remove('visible');
  }

  document.getElementById('overlay').addEventListener('click', () => {
    hideModal('sessionModal');
    hideModal('studentModal');
  });

  document.getElementById('fab').addEventListener('click', openSessionModal);
  document.getElementById('addStudentBtn').addEventListener('click', openStudentModal);

  // Initial render
  render();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
